<div class="bg-white rounded-2xl border border-neutral-200 p-5 h-full flex flex-col">
  <div class="mb-4">
    <h3 class="text-sm font-semibold text-black">{{ title }}</h3>
    @if (subtitle) {
      <p class="text-xs text-neutral-500 mt-0.5">{{ subtitle }}</p>
    }
  </div>

  <div class="flex-1 flex flex-col sm:flex-row items-center gap-6">
    <svg viewBox="0 0 100 100" class="w-32 h-32 shrink-0 -rotate-90">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#f0f0f0" stroke-width="14" />
      @for (seg of renderedSegments; track seg.label) {
        <circle
          cx="50" cy="50" r="40" fill="none"
          [attr.stroke]="seg.strokeColor"
          stroke-width="14"
          [attr.stroke-dasharray]="seg.dashArray"
          [attr.stroke-dashoffset]="seg.dashOffset"
          stroke-linecap="round"
        />
      }
    </svg>

    <div class="flex-1 w-full space-y-2.5">
      @for (seg of renderedSegments; track seg.label) {
        <div class="flex items-center justify-between text-sm">
          <div class="flex items-center gap-2 min-w-0">
            <span class="h-2.5 w-2.5 rounded-full shrink-0" [style.background-color]="seg.strokeColor"></span>
            <span class="text-neutral-600 truncate">{{ seg.label }}</span>
          </div>
          <span class="font-medium text-black shrink-0 ml-2">{{ seg.value }} · {{ seg.percent }}%</span>
        </div>
      }
    </div>
  </div>
</div>
