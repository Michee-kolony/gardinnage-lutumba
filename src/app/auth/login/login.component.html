<div class="min-h-screen w-full flex items-center justify-center bg-black px-4">

  <!-- Toast d'erreur -->
  <div
    class="fixed top-5 right-5 left-5 sm:left-auto z-50 sm:w-full sm:max-w-sm transition-all duration-300 ease-out"
    [class.opacity-100]="toastVisible"
    [class.translate-x-0]="toastVisible"
    [class.opacity-0]="!toastVisible"
    [class.translate-x-4]="!toastVisible"
    [class.pointer-events-none]="!toastVisible"
    role="alert"
    aria-live="assertive"
  >
    <div class="relative overflow-hidden rounded-xl bg-white shadow-2xl ring-1 ring-black/5 flex items-start gap-3 p-4 pr-9">

      <span class="shrink-0 h-8 w-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9 2.7 17.3A1.5 1.5 0 0 0 4 19.5h16a1.5 1.5 0 0 0 1.3-2.2L13.7 3.9a1.5 1.5 0 0 0-2.6 0z" />
        </svg>
      </span>

      <div class="min-w-0 pt-0.5">
        <p class="text-sm font-semibold text-black">Échec de connexion</p>
        <p class="text-sm text-neutral-600 mt-0.5">{{ toastMessage }}</p>
      </div>

      <button
        type="button"
        (click)="closeToast()"
        aria-label="Fermer"
        class="absolute top-3 right-3 h-6 w-6 rounded-full flex items-center justify-center text-neutral-400 hover:text-black hover:bg-neutral-100 transition-colors"
      >
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>

      @if (toastVisible) {
        <div class="absolute bottom-0 left-0 h-1 bg-red-500 toast-progress"></div>
      }

    </div>
  </div>

  <div class="w-full max-w-md">

    <div class="flex flex-col items-center mb-8">
      <div class="h-14 w-14 rounded-xl bg-white flex items-center justify-center mb-4 overflow-hidden">
        <img src="/images/logo.png" alt="Logo Gardinnage" class="h-full w-full object-contain" />
      </div>
      <h1 class="text-white text-2xl font-semibold tracking-tight">Gardinnage Admin</h1>
      <p class="text-neutral-400 text-sm mt-1">Espace d'administration sécurisé</p>
    </div>

    <form (ngSubmit)="onSubmit()" novalidate class="bg-white rounded-2xl shadow-2xl p-8 border border-neutral-200">
      <h2 class="text-lg font-semibold text-black mb-1">Connexion</h2>
      <p class="text-sm text-neutral-500 mb-6">Connectez-vous pour accéder au tableau de bord.</p>

      <label class="block text-sm font-medium text-black mb-1.5" for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        placeholder="admin@empire-security.cd"
        class="w-full rounded-lg border border-neutral-300 px-4 py-2.5 text-black placeholder-neutral-400 mb-4 focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition"
      />

      <label class="block text-sm font-medium text-black mb-1.5" for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        placeholder="••••••••"
        class="w-full rounded-lg border border-neutral-300 px-4 py-2.5 text-black placeholder-neutral-400 mb-6 focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition"
      />

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-black text-white font-medium rounded-lg py-2.5 hover:bg-neutral-800 active:bg-neutral-900 transition disabled:opacity-60 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="text-center text-neutral-500 text-xs mt-6">© 2026 Gardinnage — Tous droits réservés</p>
  </div>
</div>
