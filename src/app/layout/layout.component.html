<div class="h-screen w-full flex bg-neutral-100 overflow-hidden">

  <!-- Overlay (mobile uniquement) -->
  @if (layout.sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 z-30 md:hidden"
      (click)="layout.closeSidebar()"
    ></div>
  }

  <!-- Sidebar : tiroir plein écran sur mobile, colonne repliable sur desktop -->
  <div
    class="fixed md:relative inset-y-0 left-0 z-40 h-full shrink-0 overflow-hidden transition-all duration-300 ease-in-out"
    [ngClass]="layout.sidebarOpen() ? 'w-64 translate-x-0' : 'w-64 -translate-x-full md:w-20 md:translate-x-0'"
  >
    <app-sidebar [collapsed]="!layout.sidebarOpen()"></app-sidebar>
  </div>

  <div class="flex-1 h-full flex flex-col min-w-0">
    <app-topbar></app-topbar>
    <main class="flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
